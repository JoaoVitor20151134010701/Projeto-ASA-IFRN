services:
  dns:
    image: internetsystemsconsortium/bind9:9.18
    container_name: dns
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    networks:
      jon-network:
        ipv4_address: 172.25.0.3
    volumes:
      - ./bind:/etc/bind

  proxy:
    image: nginx:latest
    container_name: proxy
    ports:
      - "80:80"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      jon-network:
        ipv4_address: 172.25.0.10
    dns:
      - 172.25.0.3
    depends_on:
      - site1
      - site2
      - site3
      
  site1:
    image: nginx:latest
    container_name: site1
    volumes:
      - ./web/site1:/usr/share/nginx/html
    networks:
      jon-network:
        ipv4_address: 172.25.0.5
    dns:
      - 172.25.0.3

  site2:
    image: nginx:latest
    container_name: site2
    volumes:
      - ./web/site2:/usr/share/nginx/html
    networks:
      jon-network:
        ipv4_address: 172.25.0.4
    dns:
      - 172.25.0.3

  site3:
    image: nginx:latest
    container_name: site3
    volumes:
      - ./web/site3:/usr/share/nginx/html
    networks:
      jon-network:
        ipv4_address: 172.25.0.2
    dns:
      - 172.25.0.3
  
  email:
    build:
      context: ./email
      dockerfile: Dockerfile
    container_name: email    
    ports:
      - "25:25/tcp"
      - "587:587/tcp"
      - "110:110/tcp"
      - "143:143/tcp"   
    networks:
      jon-network:
        ipv4_address: 172.25.0.20
    dns:
      - 172.25.0.3
    volumes:
      # Postfix
      - ./email/postfix/main.cf:/etc/postfix/main.cf

      # Dovecot
      - ./email/dovecot/10-auth.conf:/etc/dovecot/conf.d/10-auth.conf
      - ./email/dovecot/10-mail.conf:/etc/dovecot/conf.d/10-mail.conf
      - ./email/dovecot/10-master.conf:/etc/dovecot/conf.d/10-master.conf
      - ./email/dovecot/10-ssl.conf:/etc/dovecot/conf.d/10-ssl.conf

      # Scripts e mailname
      - ./email/mail.sh:/etc/init.d/mail.sh
      - ./email/mailname:/etc/mailname

networks:
  jon-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
