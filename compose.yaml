services:
  dns:
    image: internetsystemsconsortium/bind9:9.18
    container_name: dns
    ports:
      - "8053:53/tcp"
      - "8053:53/udp"
    networks:
      - jon-network
    volumes:
      - ./bind:/etc/bind

  proxy:
    image: nginx:latest
    container_name: proxy
    ports:
      - "80:80"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - jon-network
    depends_on:
      - site1
      - site2
      - site3
      
  site1:
    image: nginx:latest
    container_name: site1
    volumes:
      - ./web/site1:/usr/share/nginx/html
    networks:
      - jon-network

  site2:
    image: nginx:latest
    container_name: site2
    volumes:
      - ./web/site2:/usr/share/nginx/html
    networks:
      - jon-network

  site3:
    image: nginx:latest
    container_name: site3
    volumes:
      - ./web/site3:/usr/share/nginx/html
    networks:
      - jon-network
  
  email:
    build:
      context: ./email
      dockerfile: Dockerfile
    container_name: email    
    ports:
      - "2525:25/tcp"
      - "587:587/tcp"
      - "110:110/tcp"
      - "143:143/tcp"
      - "993:993"
      - "995:995"   
    networks:
      - jon-network
    volumes:
      # Postfix
      - ./email/postfix/main.cf:/etc/postfix/main.cf

      # Dovecot
      - ./email/dovecot/10-auth.conf:/etc/dovecot/conf.d/10-auth.conf
      - ./email/dovecot/10-mail.conf:/etc/dovecot/conf.d/10-mail.conf
      - ./email/dovecot/10-master.conf:/etc/dovecot/conf.d/10-master.conf
      - ./email/dovecot/10-ssl.conf:/etc/dovecot/conf.d/10-ssl.conf

      # Scripts e mailname
      - ./email/mail.sh:/usr/local/bin/mail.sh
      - ./email/mailname:/etc/mailname
      # Volume corrigido para persistência nativa Docker
      - vmail-data:/var/mail/vmail
      
networks:
  jon-network:
    driver: bridge

volumes:
  vmail-data:
