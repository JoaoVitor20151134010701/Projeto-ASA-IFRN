http local {
        endpoints { "/dns-query"; };
};

options {
        directory "/var/cache/bind";

	listen-on { any; };
        listen-on-v6 { any; };
        listen-on tls ephemeral { any; };
        listen-on-v6 tls ephemeral { any; };
        listen-on tls ephemeral http local { any; };
        listen-on-v6 tls ephemeral http local { any; };
    
        forwarders {
                8.8.8.8;
                8.8.4.4;
        };

};

zone "jonas.lan"{
    type master;
    file "/etc/bind/db.jonas.lan";
    allow-transfer {
        127.0.0.1;
    };
};

zone "0.25.172.in-addr.arpa" {
    type master;
    file "/etc/bind/db.172.25";
};


