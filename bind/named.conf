http local {
        endpoints { "/dns-query"; };
};

options {
        directory "/var/cache/bind";

	listen-on { any; };
        listen-on-v6 { any; };
        listen-on tls ephemeral { any; };
        listen-on-v6 tls ephemeral { any; };
        listen-on tls ephemeral http local { any; };
        listen-on-v6 tls ephemeral http local { any; };
    
        forwarders {
                8.8.8.8;
                8.8.4.4;
        };

};

zone "jonaslab.test" {
    type master;
    file "/etc/bind/db.dsrjoaovitor.testes";
};

zone "6.24.10.in-addr.arpa" {
    type master;
    file "/etc/bind/db.10.24.6";
};


