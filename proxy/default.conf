# Upstreams para cada site
upstream jonastech {
    server site1:80;
}
upstream jonasredes {
    server site2:80;
}
upstream jonasti {
    server site3:80;
}

# Servidor para Jonastech
server {
    listen       80;
    listen  [::]:80;
    server_name  jonastech.jonas.lan;

    access_log  /var/log/nginx/jonastech.access.log  main;

    location / {
        proxy_pass http://jonastech;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

